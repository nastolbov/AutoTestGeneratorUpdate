name: Build app (Windows + macOS)

# Собирает портативные приложения через jpackage и выкладывает готовые ZIP в артефакты:
#   AutoTestGenerator-windows.zip      — двойной клик по AutoTestGenerator.exe
#   AutoTestGenerator-macos-arm64.zip  — Apple Silicon (M1/M2/…)
#   AutoTestGenerator-macos-x64.zip    — Mac на Intel
# Запуск: пушем в рабочую ветку либо вручную (Actions → Run, когда workflow в основной ветке).
on:
  workflow_dispatch:
  push:
    branches:
      - claude/keen-feynman-81x1rh
    paths:
      - '.github/workflows/build-app.yml'
      - 'src/**'
      - 'pom.xml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 23: умеет читать классы JavaFX 24 (class-version 66) и содержит jpackage.
      # Он же становится средой выполнения приложения и используется mvn для тестов.
      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      # Один реактор: собираем jar и складываем зависимости (JavaFX с win-нативами, sqlite).
      - name: Build jar and collect dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          mvn -B clean package dependency:copy-dependencies -DskipTests "-DoutputDirectory=target/jpkg-input" "-DincludeScope=runtime"
          if ($LASTEXITCODE -ne 0) { throw "maven build failed" }
          Copy-Item (Resolve-Path target/autotestgenerator-*.jar) target/jpkg-input/

      - name: Build app-image with jpackage
        shell: pwsh
        run: |
          jpackage --type app-image --name AutoTestGenerator --input target/jpkg-input --main-jar autotestgenerator-1.0.0.jar --main-class ru.autotestgen.ui.Launcher --runtime-image "$env:JAVA_HOME" --dest target/dist

      - name: Bundle Maven
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mavenVersion = "3.9.9"
          Invoke-WebRequest -Uri "https://dlcdn.apache.org/maven/maven-3/$mavenVersion/binaries/apache-maven-$mavenVersion-bin.zip" -OutFile maven.zip
          Expand-Archive maven.zip -DestinationPath maven-extract
          Move-Item "maven-extract/apache-maven-$mavenVersion" target/dist/AutoTestGenerator/maven

      - name: Assemble release zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item "РУКОВОДСТВО.html" target/dist/
          Copy-Item "ЧИТАЙ_МЕНЯ.txt" target/dist/
          Compress-Archive -Path target/dist/* -DestinationPath AutoTestGenerator-windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoTestGenerator-windows
          path: AutoTestGenerator-windows.zip

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      # На mac-раннере подтянутся mac-классификаторы JavaFX (-mac-aarch64 / -mac) с нативными .dylib.
      - name: Build jar and collect dependencies
        run: |
          set -e
          mvn -B clean package dependency:copy-dependencies -DskipTests -DoutputDirectory=target/jpkg-input -DincludeScope=runtime
          cp target/autotestgenerator-*.jar target/jpkg-input/

      - name: Build app-image with jpackage
        run: |
          set -e
          jpackage --type app-image --name AutoTestGenerator --input target/jpkg-input --main-jar autotestgenerator-1.0.0.jar --main-class ru.autotestgen.ui.Launcher --runtime-image "$JAVA_HOME" --dest target/dist

      - name: Bundle Maven
        run: |
          set -e
          MV=3.9.9
          curl -fsSL -o maven.zip "https://dlcdn.apache.org/maven/maven-3/$MV/binaries/apache-maven-$MV-bin.zip"
          unzip -q maven.zip
          mv "apache-maven-$MV" "target/dist/AutoTestGenerator.app/Contents/maven"

      # ditto/zip с сохранением симлинков — иначе runtime внутри .app ломается.
      - name: Assemble release zip
        run: |
          set -e
          cp РУКОВОДСТВО.html target/dist/
          cp ЧИТАЙ_МЕНЯ.txt target/dist/
          cd target/dist
          zip -r -y "../../AutoTestGenerator-macos-${{ matrix.arch }}.zip" AutoTestGenerator.app РУКОВОДСТВО.html ЧИТАЙ_МЕНЯ.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoTestGenerator-macos-${{ matrix.arch }}
          path: AutoTestGenerator-macos-${{ matrix.arch }}.zip
